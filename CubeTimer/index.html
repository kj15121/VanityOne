<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="styling.css" />
    <script type="module" src="timer_handler.js"></script>
    <script type="module" src="stats_handler.js"></script>
    <script type="module" src="session_handler.js"></script>

    <title>Cubing Timer</title>
</head>
<body>

    <div id="timer">
        <p id="sec">00</p>
        <p id="msec">000</p>
    </div>
    <div id="timer_landing"></div>

    <div id="stats">
        <div id="stats_main">
            <table id="stats_main_table">
                <tr>
                    <th colspan="4">Stats</th>
                </tr>
                <tr>
                    <th></th>
                    <th>Current</th>
                    <th>Best</th>
                    <th>Target</th>
                </tr>
                <tr>
                    <th>Time</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Mo3</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Ao5</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Ao12</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </table>
        </div>
        <div id="stats_list">
            <table id="stats_list_table">
                <tr style="cursor: pointer;" onclick="showSessionMenu()">
                    <th id="session_name" colspan="4">Session - Default</th>
                </tr>
                <tr>
                    <th>S.No</th>
                    <th>Time</th>
                    <th>Mo3</th>
                    <th>Ao5</th>
                </tr>
            </table>
        </div>
    </div>

    <div id="sessions" onclick="hideSessionMenu()">
        <div onclick="event.stopPropagation()">
            <div id="sessions_list">
                <table id="sessions_list_table">
                    <colgroup>
                        <col span="2">
                        <col span="1" width="15%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th colspan="3">Sessions</th>
                        </tr>
                        <tr>
                            <th>Session</th>
                            <th>Last used</th>
                            <th>Solves</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="sessions_options">
                <table id="sessions_options_table">
                    <tr>
                        <td class="material-symbols-outlined"
                            style="color: var(--text-green)"
                            onmouseover="sessionOptions_mOver(0)" onmouseout="sessionOptions_mOut(0)" onclick="sessionOptions_mClick(0)"
                            title="Create new session">
                            add
                        </td>
                        <td class="material-symbols-outlined"
                            onmouseover="sessionOptions_mOver(1)" onmouseout="sessionOptions_mOut(1)" onclick="sessionOptions_mClick(1)"
                            title="Rename session">
                            edit
                        </td>
                        <td class="material-symbols-outlined"
                            onmouseover="sessionOptions_mOver(2)" onmouseout="sessionOptions_mOut(2)" onclick="sessionOptions_mClick(2)"
                            title="Import from file">
                            download
                        </td>
                        <td class="material-symbols-outlined"
                            onmouseover="sessionOptions_mOver(3)" onmouseout="sessionOptions_mOut(3)" onclick="sessionOptions_mClick(3)"
                            title="Export to file">
                            upload
                        </td>
                        <td class="material-symbols-outlined"
                            style="color: var(--text-red)"
                            onmouseover="sessionOptions_mOver(4)" onmouseout="sessionOptions_mOut(4)" onclick="sessionOptions_mClick(4)"
                            title="Remove session permanently">
                            delete
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
