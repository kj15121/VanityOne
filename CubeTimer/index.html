<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="styling.css" />
    <script type="module" src="timer_handler.js"></script>
    <script type="module" src="stats_handler.js"></script>

    <title>Cubing Timer</title>
</head>
<body>
    <div id="timer">
        <p id="sec">00</p>
        <p id="msec">000</p>
    </div>
    <div id="timer_landing"></div>

    <div id="stats">
        <div id="stats_main">
            <table id="stats_main_table">
                <tr>
                    <th colspan="4">Stats</th>
                </tr>
                <tr>
                    <th></th>
                    <th>Current</th>
                    <th>Best</th>
                    <th>Target</th>
                </tr>
                <tr>
                    <th>Time</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Mo3</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Ao5</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Ao12</th>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
            </table>
        </div>
        <div id="stats_list">
            <table id="stats_list_table">
                <tr>
                    <th>S.No</th>
                    <th>Time</th>
                    <th>Mo3</th>
                    <th>Ao5</th>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
